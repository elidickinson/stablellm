# Reloadable proxy config. Copy to config.yaml and edit.
# Bind-time settings (HOST, PORT, REQUEST_TIMEOUT, CONNECT_TIMEOUT, API_KEY) live in .env —
# changing them requires a server restart.

settings:
  cooloff_seconds: 30
  race_interval_secs: 21600  # 6h
  race_interval_requests: 25
  log_level: INFO

# Provider registry — just base_url + api_key, no model info.
providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  openai_backup:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_BACKUP_KEY}

  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key: ${CEREBRAS_API_KEY}

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}

  crofai:
    base_url: https://crof.ai/v1
    api_key: ${CROFAI_API_KEY}

  synthetic:
    base_url: https://api.synthetic.new/v1
    api_key: ${SYNTHETIC_API_KEY}

# Groups map request model names to an ordered list of (provider, model_override).
# "default" is the fallback when no other group matches.
groups:
  default:
    - provider: openai
      model: gpt-4o

  gpt-4o:
    - provider: openai
    - provider: openai_backup
    - provider: openrouter
      model: openai/gpt-4o

  cheap:
    - provider: cerebras
      model: zai-glm-4.7
      flags: [keep_reasoning]
    - provider: openrouter
