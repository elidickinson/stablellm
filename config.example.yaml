# Reloadable proxy config. Copy to config.yaml and edit.
# Bind-time settings (HOST, PORT, REQUEST_TIMEOUT, CONNECT_TIMEOUT, API_KEY) live in .env —
# changing them requires a server restart.

settings:
  cooloff_seconds: 30
  race_interval_secs: 21600  # 6h
  race_interval_requests: 25
  log_level: INFO

# Provider registry — just base_url + api_key, no model info.
providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  openai_backup:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_BACKUP_KEY}

  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key: ${CEREBRAS_API_KEY}

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}

  crofai:
    base_url: https://crof.ai/v1
    api_key: ${CROFAI_API_KEY}

  synthetic:
    base_url: https://api.synthetic.new/v1
    api_key: ${SYNTHETIC_API_KEY}

# Groups map a request model name to a routing mode and an ordered list of
# (provider, model_override) endpoints. The client's 'model' field must match
# a group name (case-insensitively); unknown models get a 404.
# mode is "seq" (try in order, default) or "race" (send to all, first response wins).
# The client can override with a :race or :seq suffix on the model name (e.g.,
# "cheap:race"). :fastest and :normal are aliases.
groups:
  gpt-4o:
    # Optional per-group metadata, surfaced on /v1/models in OpenRouter's shape.
    # Every field is optional; omit any you don't want to publish. Costs are
    # dollars per million tokens (serialized as OpenRouter's per-token strings).
    meta:
      name: "GPT-4o"
      description: "OpenAI flagship multimodal model"
      context: 128000
      max_output: 16384
      modalities: [text, image]
      input_cost: 2.50
      output_cost: 10.00
      cache_read_cost: 0.31
      cache_write_cost: 10.00
      supports_reasoning: false
      # reasoning_efforts: [low, medium, high]     # only valid when supports_reasoning: true
      # reasoning_default: medium                  # must be one of reasoning_efforts
      # reasoning_default_enabled: true            # omit unless you need to publish it
      # reasoning_mandatory: false                 # reasoning cannot be disabled by the client
    endpoints:
      - provider: openai
      - provider: openai_backup
      - provider: openrouter
        model: openai/gpt-4o

  cheap:
    mode: race
    endpoints:
      - provider: cerebras
        model: zai-glm-4.7
        flags: [keep_reasoning]
      - provider: openrouter
